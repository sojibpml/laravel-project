apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: laravel-ingress
  namespace: laravel

spec:
  ingressClassName: nginx

  rules:
    - host: sojib.com
      http:
        paths:
          - path: /
            pathType: Prefix

            backend:
              service:
                name: nginx-service
                port:
                  number: 80
