apiVersion: v1
kind: ConfigMap

metadata:
  name: laravel-config
  namespace: laravel

data:
  APP_ENV: production
  APP_DEBUG: "false"

  DB_HOST: mysql-service
  DB_PORT: "3306"
  DB_DATABASE: laravel

  REDIS_HOST: redis-service
  REDIS_PORT: "6379"

  QUEUE_CONNECTION: redis
  CACHE_STORE: redis
  SESSION_DRIVER: redis
