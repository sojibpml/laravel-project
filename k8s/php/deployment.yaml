apiVersion: apps/v1
kind: Deployment

metadata:
  name: php
  namespace: laravel

spec:
  replicas: 2
  selector:
    matchLabels:
      app: php

  template:
    metadata:
      labels:
        app: php

    spec:
      containers:
        - name: php

          image: sojib123/laravel-app:latest

          ports:
            - containerPort: 9000

          envFrom:
            - configMapRef:
                name: laravel-config

            - secretRef:
                name: laravel-secret

          readinessProbe:
            tcpSocket:
              port: 9000

            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            tcpSocket:
              port: 9000

            initialDelaySeconds: 30
            periodSeconds: 20
