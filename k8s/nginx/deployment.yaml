apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: laravel

spec:
  replicas: 2

  selector:
    matchLabels:
      app: nginx

  template:
    metadata:
      labels:
        app: nginx

    spec:
      containers:
        - name: nginx
          image: sojib123/laravel-nginx:latest

          ports:
            - containerPort: 80
