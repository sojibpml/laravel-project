services:
    php:
        build:
            context: .
            dockerfile: docker/php/Dockerfile

        volumes:
            - .:/var/www/html

        expose:
            - "9000"

        networks:
            - laravel

    nginx:
        image: nginx:alpine

        container_name: laravel_nginx

        ports:
            - "8081:80"

        volumes:
            - .:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

        depends_on:
            - php

        networks:
            - laravel

    mysql:
        image: mysql:8.0

        environment:
            MYSQL_DATABASE: demoproject
            MYSQL_USER: laravel
            MYSQL_PASSWORD: secret
            MYSQL_ROOT_PASSWORD: root

        ports:
            - "3307:3306"

        volumes:
            - mysql_data:/var/lib/mysql

        networks:
            - laravel

volumes:
    mysql_data:

networks:
    laravel:
