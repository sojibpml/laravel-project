services:
    php:
        build:
            context: .
            dockerfile: docker/php/Dockerfile

        container_name: laravel_php

        working_dir: /var/www

        volumes:
            - ./:/var/www

        depends_on:
            - mysql
            - redis

        networks:
            - laravel

    nginx:
        build:
            context: .
            dockerfile: docker/nginx/Dockerfile

        container_name: laravel_nginx

        ports:
            - "8080:80"

        volumes:
            - ./:/var/www

        depends_on:
            - php

        networks:
            - laravel

    mysql:
        image: mysql:8.0

        container_name: laravel_mysql

        restart: unless-stopped

        environment:
            MYSQL_DATABASE: laravel
            MYSQL_USER: laravel
            MYSQL_PASSWORD: laravel_password
            MYSQL_ROOT_PASSWORD: root_password

        ports:
            - "3307:3306"

        volumes:
            - mysql_data:/var/lib/mysql

        networks:
            - laravel

    redis:
        image: redis:alpine

        container_name: laravel_redis

        restart: unless-stopped

        ports:
            - "6379:6379"

        volumes:
            - redis_data:/data

        networks:
            - laravel

    queue:
        build:
            context: .
            dockerfile: docker/php/Dockerfile

        container_name: laravel_queue

        working_dir: /var/www

        command: php artisan queue:work redis --sleep=3 --tries=3

        volumes:
            - ./:/var/www

        depends_on:
            - php
            - redis
            - mysql

        networks:
            - laravel

volumes:
    mysql_data:

    redis_data:

networks:
    laravel:
